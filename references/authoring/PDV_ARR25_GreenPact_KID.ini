; PlayerDevotion ARR 2.5 Green Pact classification
; Exact item names are taken from direct raw-file readback of the defining plugins.
; Name filters are required for Potion records because KID treats Form filters as
; referenced magic-effect filters for this type. No plugin master is introduced.

; Existing curated base/Requiem food names, retained for parity with the deployed file.
Keyword = PDV_KW_GreenPact_Meat|Potion|Torn Flesh,Strange Meat,Skeever Meat,Wrothgar Tartare,Fox Meat,Bear Meat,Mammoth Meat,Sabrecat Meat,Troll Meat

; ARR 2.5 exact animal-food names. These are Green Pact-compliant repeatable foods.
Keyword = PDV_KW_GreenPact_Meat|Potion|Fox Roast,Bear Haunch,Mammoth Roast,Sabre Cat Steak,Troll Steak,Roasted Dog Meat
Keyword = PDV_KW_GreenPact_Meat|Potion|Chub Loon Breast,Grilled Chub Loon Breast,Cliff Racer Tail,Cliff Racer Stew,Frog Legs,Fried Frog Legs,Raw Bantam Guar Thigh,Roast Bantam Guar Haunch

; Kabu's three new gourd records all resolve to the exact item name "Gourd".
; Matching the base-game gourd too is harmless: vanilla food is already classified by
; the static FormList and duplicate membership does not create an extra event.
Keyword = PDV_KW_GreenPact_Plant|Potion|Gourd
