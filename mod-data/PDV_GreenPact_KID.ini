; PlayerDevotion Green Pact tag layer
; KID scans flat Data for *_KID.ini. Mod-added foods are classified here so
; Devotion.esp never gains a hard master on the food's source plugin.
;
; Potion Form filters resolve against magic effects, not the potion record.
; Item-name matching is therefore intentional and remains safe when Requiem
; or its food overhaul is absent: the rules simply match nothing.

; Meat is pact-compatible and earns a small positive act for a bound Bosmer.
