; PlayerDevotion religious-recognition cohort layer
; Requires SPID to apply. Devotion remains fully playable without SPID; only
; NPC recognition is absent. This file adds semantic keywords and hidden
; cohort factions. It never distributes AI packages, combat data, or items.
;
; Every Faction line consumes the keyword authored immediately above it.
; SPID distributes keywords before factions, so each evidence rule has one
; target definition and one stable cohort consequence.

