; PlayerDevotion Green Pact tag layer
; KID receives mod-added food classifications here after hand curation.
; Keep broad wildcard rules out of beta unless the food family is reviewed.

;
; THIS FILE IS TRACKED IN GIT (mod-data/SKSE/Plugins/KeywordItemDistributor/).
; It is tracked BECAUSE the reasoning below has already been lost once: the
; 2026-08-06 packaging archive shipped a rule superset with the entire comment
; block stripped, and nothing flagged it because the deployed file lived only in
; the MO2 tree. An external reviewer caught it, not us. A regeneration that drops
; the reasoning now shows up as a diff instead of arriving silently.
; If you regenerate this file, carry the comment block forward or the next person
; re-adds mod food to PDV_FLST_GreenPact_* and ships a missing-master failure.

; Keyword = PDV_KW_GreenPact_Plant|Potion|<EditorID or FormID filters>
; Keyword = PDV_KW_GreenPact_Meat|Potion|<EditorID or FormID filters>
; Keyword = PDV_KW_GreenPact_Fungi|Potion|<EditorID or FormID filters>
; Keyword = PDV_KW_GreenPact_Egg|Potion|<EditorID or FormID filters>
; Keyword = PDV_KW_GreenPact_Insect|Potion|<EditorID or FormID filters>

; -------------------------------------------------------------------------
; Why mod-added food is tagged HERE and not added to PDV_FLST_GreenPact_*:
; a FormList entry pointing at another plugin's record makes that plugin a
; MASTER of Devotion.esp, so anyone without it gets a missing-master failure
; and the plugin will not load. KID re-applies at every startup with no master
; dependency and no save footprint. The routing code accepts either path
; (FormMatchesListOrKeyword). Vanilla + DLC food stays in the FormLists;
; everything mod-added belongs in this file.
;
; WHY THESE MATCH BY NAME, NOT FormID/EditorID:
; for the Potion type KID resolves a Form filter against the item's MAGIC
; EFFECTS, not against the item's own FormID -- so "0x284894~Requiem.esp"
; would look for a food whose EFFECT is that record and match nothing. The
; item-name string channel applies to all types and is the correct filter
; here. (KID v3.5.0 grammar, filters section 1 vs 2.)
;
; Name matching is also self-correcting for food classification: if another
; mod adds its own "Bear Meat", tagging it as meat is still right.
; -------------------------------------------------------------------------

; Requiem + Requiem - Food and Beverages Redone.
; Eating any of these REWARDS a pact-keeping Bosmer (meat is permitted; it is
; eating PLANTS that breaks the Green Pact).
;
; "Torn Flesh" and "Strange Meat" are the same record (284894:Requiem.esp)
; under two different names: base Requiem calls it Strange Meat, and Food and
; Beverages Redone renames it to Torn Flesh. Both are listed so the rule holds
; whether or not that patch is installed.
;
; Safe when Requiem is absent - KID simply matches nothing.
Keyword = PDV_KW_GreenPact_Meat|Potion|Torn Flesh,Strange Meat,Skeever Meat,Wrothgar Tartare,Fox Meat,Bear Meat,Mammoth Meat,Sabrecat Meat,Troll Meat
