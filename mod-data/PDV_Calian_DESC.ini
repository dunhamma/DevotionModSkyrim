; Devotion -- item descriptions for Description Framework.
;
; SOFT DEPENDENCY, BY DESIGN. Description Framework is present on Authoria/ARR 2.5 and absent on
; Anvil. This file is plain data: with the framework installed the description shows on the item
; card, without it nothing reads the file and nothing errors. Do NOT switch this to the Papyrus
; API (DescriptionFramework.SetDescription) -- that native is not persisted across saves, must be
; reapplied on every load, and would throw Papyrus errors on any list that lacks the DLL.
;
; Format: 0x<FormID>~<Plugin.esp>|<description>   (one entry per line)

0x0716E4~Devotion.esp|A sphere of milky aetherquartz and sun-blown glass, placed in your hands at eighteen by a Curate. It is the proof that you are counted among your people. It has not been broken. Turning it over in your hands is practice enough, wherever you are.
