; PlayerDevotion item-action classification layer
; Requires KID to apply. All rules are flat Data-root rules and add only
; Devotion-owned semantic keywords. Missing source mods simply match nothing.

; Namira: taboo food knowingly consumed.
Keyword = PDV_KYWD_KID_NamiraTabooFood|Potion|Human Flesh,Human Heart,Strange Meat,Torn Flesh|F

; Sanguine: alcohol knowingly consumed. Separate wildcard lines form a union.
; The *Mead wildcard also matches the keyword _SH_MeadWATERBottleKeyword on SunHelm's
; "Bottle of Water" (07AA96:SunHelmSurvival.esp) -- the only leaking record (verified against the
; live load order). Exclude it by FormID. A missing exclusion form is inert (it can only fail to
; exclude, never drop the line), so *Mead still catches vanilla mead when SunHelm is absent.
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Ale|F
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Mead,-0x07AA96~SunHelmSurvival.esp|F
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Wine|F
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Brandy|F

; Zenithar: reviewed trade goods sold through the barter menu.
; DISABLED 2026-08 -- never design-approved and over-broad: *Gem/*Ore/*Ingot leaked via the vendor
; keywords VendorItemGem / VendorItemOreIngot, so selling any gem/ore/ingot pinged Zenithar. Disabled
; by commenting -- the keyword stops distributing, so HasKeyword is false and RouteKIDRemovedAction's
; zenithar_trade branch is inert. Re-enable only as a curated, hard-capped commerce faucet.
;Keyword = PDV_KYWD_KID_ZenitharTradeGood|Misc Item|*Ingot
;Keyword = PDV_KYWD_KID_ZenitharTradeGood|Misc Item|*Ore
;Keyword = PDV_KYWD_KID_ZenitharTradeGood|Misc Item|*Gem
;Keyword = PDV_KYWD_KID_ZenitharTradeGood|Armor|*Circlet
;Keyword = PDV_KYWD_KID_ZenitharTradeGood|Armor|*Necklace
;Keyword = PDV_KYWD_KID_ZenitharTradeGood|Armor|*Ring

; Hircine and Kyne: trophies taken from a creature the player killed.
; DISABLED 2026-08 -- never design-approved and over-broad: *Hide leaked via VendorItemAnimalHide, so
; looting Leather Strips off a killed bandit built Hircine; it also double-credited Kyne and had no
; animal-only gate. Hircine's intended faucet is regalia-equip, not skinning. Disabled by commenting --
; the keyword stops distributing, so both the hunt_trophy Hircine route and its Kyne credit are inert.
;Keyword = PDV_KYWD_KID_HircineHuntTrophy|Misc Item|*Pelt
;Keyword = PDV_KYWD_KID_HircineHuntTrophy|Misc Item|*Hide
;Keyword = PDV_KYWD_KID_HircineHuntTrophy|Ingredient|*Claw
;Keyword = PDV_KYWD_KID_HircineHuntTrophy|Ingredient|*Fang
;Keyword = PDV_KYWD_KID_HircineHuntTrophy|Ingredient|*Tusk
;Keyword = PDV_KYWD_KID_HircineHuntTrophy|Ingredient|*Antler

; Arkay and Tu'whacca: offerings intentionally placed with the dead.
Keyword = PDV_KYWD_KID_FuneraryOffering|Ingredient|Lavender,Blue Mountain Flower,Juniper Berries
Keyword = PDV_KYWD_KID_FuneraryOffering|Misc Item|Gold,Gold001

; Malacath: Orcish arms and armour made at a crafting bench.
Keyword = PDV_KYWD_KID_OrcishCraft|Weapon|*Orcish
Keyword = PDV_KYWD_KID_OrcishCraft|Armor|*Orcish

