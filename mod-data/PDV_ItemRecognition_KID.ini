; PlayerDevotion item-action classification layer
; Requires KID to apply. All rules are flat Data-root rules and add only
; Devotion-owned semantic keywords. Missing source mods simply match nothing.

; Namira: taboo food knowingly consumed.
Keyword = PDV_KYWD_KID_NamiraTabooFood|Potion|Human Flesh,Human Heart,Strange Meat,Torn Flesh|F

; Sanguine: alcohol knowingly consumed. Separate wildcard lines form a union.
; 1.5.0e: exclude survival-mod water bottles. The *Mead/*Wine wildcards match the
; SunHelm water-bottle KEYWORD editor-IDs (_SH_MeadWATERBottleKeyword etc.), so drinking
; water was awarding Sanguine. KID Potion form-filters resolve against magic effects, not
; keywords, so the fix is a name exclusion on the water item ("Bottle of Water").
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Ale,-Bottle of Water|F
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Mead,-Bottle of Water|F
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Wine,-Bottle of Water|F
Keyword = PDV_KYWD_KID_SanguineAlcohol|Potion|*Brandy,-Bottle of Water|F

